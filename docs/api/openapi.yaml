openapi: 3.0.3
info:
  title: SMTP Platform Control Plane API
  version: 1.0.0
  description: >
    Tenant-scoped development control-plane API. Production OIDC authentication
    and durable Go-to-queue submission are intentionally not enabled yet.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Control plane
    description: Tenant-scoped development control-plane operations.
paths:
  /v1/me:
    get:
      summary: Current authenticated principal
      tags: [Control plane]
      responses:
        "200": { description: Principal and tenant role, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/tenants/current:
    get:
      summary: Current tenant
      tags: [Control plane]
      responses:
        "200": { description: Tenant summary, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/domains:
    get:
      summary: List tenant domains
      tags: [Control plane]
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Paginated domain list, content: { application/json: { schema: { $ref: "#/components/schemas/ListResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Register a pending domain
      tags: [Control plane]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties: { domain: { type: string, maxLength: 253 } }
      responses:
        "201": { description: Registered domain }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/api-keys:
    get:
      summary: List safe API-key metadata
      tags: [Control plane]
      responses:
        "200": { description: API-key metadata; secret is never returned }
    post:
      summary: Create an API key; secret is returned once
      tags: [Control plane]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 120 }
                scopes: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: One-time secret response }
  /v1/api-keys/{id}/revoke:
    post:
      summary: Revoke an API key
      tags: [Control plane]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Revoked }
        "404": { description: Not found without cross-tenant enumeration }
  /v1/domains/{id}/verification:
    post:
      summary: Create a DNS verification challenge
      tags: [Control plane]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Verification record and one-time challenge secret }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/domains/{id}/verification/check:
    post:
      summary: Check a DNS verification challenge
      tags: [Control plane]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Verification status }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/mailboxes:
    get:
      summary: List tenant mailboxes
      tags: [Control plane]
      responses:
        "200": { description: Bounded mailbox list }
  /v1/mailboxes/{mailbox_id}/messages:
    get:
      summary: List mailbox message metadata
      tags: [Control plane]
      parameters: [{ name: mailbox_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Bounded message metadata without raw bodies }
  /v1/mailboxes/{mailbox_id}/messages/{message_id}:
    get:
      summary: Get one message metadata
      tags: [Control plane]
      parameters:
        - { name: mailbox_id, in: path, required: true, schema: { type: string } }
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Message metadata }
        "404": { description: Non-enumerating not found response }
  /v1/domains/{id}/checks:
    post:
      summary: Run bounded DNS diagnostics for a tenant domain
      tags: [Control plane]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Advisory SPF, DMARC, MX, and ownership results }
        "429": { description: Check rate limit }
  /v1/domains/{id}/readiness:
    get:
      summary: Get cached domain readiness
      tags: [Control plane]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Explicit ready, degraded, action_required, or checking state }
  /v1/usage:
    get:
      summary: Get current tenant message usage window
      tags: [Control plane]
      responses:
        "200": { description: Tenant-scoped usage and configured limit }
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    InvalidRequest:
      description: Invalid request or query
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Permission denied
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Resource conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, maxLength: 64 }
    ListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object } }
        next_page: { nullable: true }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
