[package]
name = "mail-delivery"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "mail-delivery"

[dependencies]
async-trait = "0.1.89"
mail-queue = { path = "../smtp-queue" }
shared-types = { path = "../smtp-core" }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["io-util", "net", "time", "macros", "rt-multi-thread", "sync", "signal", "fs"] }
tokio-rustls = "0.26.4"
trust-dns-resolver = { version = "0.23.2", default-features = false, features = ["tokio-runtime", "system-config"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
webpki-roots = "1.0.4"
mail-auth = { version = "0.14.1", features = ["generate"] }
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
quick-xml = { version = "0.38.3", features = ["serialize"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
uuid = { version = "1.18.1", features = ["v4"] }
