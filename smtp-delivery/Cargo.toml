[package]
name = "mail-delivery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.89"
mail-queue = { path = "../smtp-queue" }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["io-util", "net", "time", "macros", "rt-multi-thread"] }
tokio-rustls = "0.26.4"
trust-dns-resolver = { version = "0.23.2", default-features = false, features = ["tokio-runtime"] }
webpki-roots = "1.0.4"

[dev-dependencies]
chrono = { version = "0.4.42", features = ["clock"] }
uuid = { version = "1.18.1", features = ["v4"] }
