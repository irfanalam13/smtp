[package]
name = "smtp-imap"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = "0.5.3"
base64.workspace = true
chrono.workspace = true
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
sqlx.workspace = true
smtp-core = { package = "shared-types", path = "../smtp-core" }
smtp-ingress = { package = "smtp-ingress", path = "../smtp-session" }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = "0.26.4"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
rcgen = "0.14.10"
