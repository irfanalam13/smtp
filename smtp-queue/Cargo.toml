[package]
name = "mail-queue"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
rand = "0.9.2"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
serde_json.workspace = true
shared-types = { path = "../smtp-core" }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "time", "signal", "sync", "rt-multi-thread"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
