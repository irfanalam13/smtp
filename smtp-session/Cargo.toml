[package]
name = "smtp-ingress"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.48.0", features = ["macros", "net", "io-util", "time", "sync", "signal", "rt-multi-thread"] }
mail-queue = { path = "../smtp-queue" }
uuid = { version = "1.18.1", features = ["v4"] }
async-trait = "0.1.89"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
chrono = { version = "0.4.42", features = ["clock"] }
thiserror = "2.0.17"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"