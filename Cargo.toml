[workspace]
resolver = "3"
members = [
    "smtp-session",
    "smtp-queue",
    "smtp-delivery",
    "smtp-core",
    "smtp-imap",
    "smtp-pop3",
    "mailbox-service",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.99"

[workspace.dependencies]
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
hmac = "0.12.1"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
flate2 = "1.1.5"
mail-parser = "1.0.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
